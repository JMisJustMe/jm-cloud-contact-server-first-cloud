# PROPOSAL ONLY — separate Render staging service; not deployed
# The canonical v0.5.1 hosted blueprint on its own branch is unchanged.
services:
  - type: web
    name: jm-cloud-contact-server-v05-cp09-stage
    runtime: docker
    plan: free
    region: frankfurt
    branch: jm-cc-cp09-v05-security-descendant
    autoDeploy: false
    dockerfilePath: ./CP09/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: JM_CLOUD_MODE
        value: production
      - key: JM_CLOUD_ADMIN_TOKEN
        generateValue: true
      - key: JM_CLOUD_SERVER_SECRET
        generateValue: true
      - key: JM_CLOUD_ORIGINS
        value: https://jm-cloud-contact-server-v05-cp09-stage.onrender.com
      - key: JM_CLOUD_DATA
        value: /data/JM_CLOUD_CONTACT_DATA_CP09_STAGE.json
      - key: JM_CLOUD_PROFILE_DIR
        value: /app/profiles
      - key: JM_CLOUD_PROFILE_MANIFEST
        value: /app/profiles/JM_CLOUD_PROFILE_MANIFEST_HOSTED_v0_5_1.json
      - key: JM_CLOUD_RECEIPT_SIGNING_KEY
        value: /data/JM_CLOUD_RECEIPT_KEY_CP09_STAGE.pem
      - key: JM_CLOUD_RATE_WINDOW_MS
        value: "60000"
      - key: JM_CLOUD_RATE_MAX
        value: "360"
# Staging omits the existing market DB connection to avoid touching live data.
# Stage is ephemeral until a separately authorised durable storage plan exists.
