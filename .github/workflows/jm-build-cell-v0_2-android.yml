name: JM Build Cell v0.2 Android APK

on:
  push:
    branches:
      - jm-build-cell-v0.2-android-apk
  workflow_dispatch:

jobs:
  android-apk-full-cloud-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android build descendant
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Full JM Cloud + Android APK Build suite
        run: npm test
