name: JM Build Cell v0.2 Android APK

on:
  push:
    branches:
      - jm-build-cell-v0.2-android-apk
  workflow_dispatch:

jobs:
  android-apk-build-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android build descendant
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax gates
        run: |
          node --check build/JM_BUILD_CELL_PROFILE_v0_2.mjs
          node --check build/JM_ANDROID_FORGE_CLOUD_ADAPTER_v0_1.mjs
          node --check build/native/android/JM_FORGE_CORE_DONOR_v1_4_1.js
          node --check build/native/android/JM_PHONE_FORGE_CLOUD_SAFE_v1_4_1.js
      - name: Real JM Android APK build QA
        run: node qa/JM_BUILD_CELL_ANDROID_QA_v0_2.mjs
