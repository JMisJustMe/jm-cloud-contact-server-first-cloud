name: JM Compute Cell v0.1

on:
  push:
    branches:
      - jm-compute-cell-v0.1
  pull_request:
    branches:
      - hosted-v0.5-descendant
  workflow_dispatch:

jobs:
  compute-cell-full-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout descendant
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install hosted dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Full JM hosted cloud + Compute Cell suite
        run: npm test
