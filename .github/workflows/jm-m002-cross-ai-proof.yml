name: JM M002 Cross-AI candidate proof
on:
  push:
    branches:
      - jm-m002-cross-ai-execution-v0.1-20261021
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install inherited gateway dependencies
        run: npm install --no-audit --no-fund
      - name: Inherited preflight including M002 offline provider tests
        run: npm run preflight
      - name: Diagnose candidate secret NAMES ONLY (no secret values)
        env:
          M002_GEMINI_DEFINED: ${{ secrets.JM_M002_GEMINI_API_KEY != '' }}
          GEMINI_DEFINED: ${{ secrets.GEMINI_API_KEY != '' }}
          GOOGLE_DEFINED: ${{ secrets.GOOGLE_API_KEY != '' }}
          GOOGLE_GENAI_DEFINED: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY != '' }}
          GENAI_DEFINED: ${{ secrets.GENAI_API_KEY != '' }}
          M002_OPENAI_DEFINED: ${{ secrets.JM_M002_OPENAI_API_KEY != '' }}
        run: |
          echo "JM_M002_GEMINI_API_KEY_EXISTS=$M002_GEMINI_DEFINED"
          echo "GEMINI_API_KEY_EXISTS=$GEMINI_DEFINED"
          echo "GOOGLE_API_KEY_EXISTS=$GOOGLE_DEFINED"
          echo "GOOGLE_GENERATIVE_AI_API_KEY_EXISTS=$GOOGLE_GENAI_DEFINED"
          echo "GENAI_API_KEY_EXISTS=$GENAI_DEFINED"
          echo "JM_M002_OPENAI_API_KEY_EXISTS=$M002_OPENAI_DEFINED"
      - name: Verify existing OpenAI credential via non-inference model-list endpoint
        env:
          JM_OPENAI_KEY: ${{ secrets.JM_M002_OPENAI_API_KEY }}
        run: |
          set +x
          if [ -z "$JM_OPENAI_KEY" ]; then echo "OPENAI_AUTH=KEY_MISSING"; exit 0; fi
          status=$(curl --silent --show-error --max-time 12 --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $JM_OPENAI_KEY" https://api.openai.com/v1/models) || status="NETWORK_FAILURE"
          case "$status" in
            200) echo "OPENAI_AUTH=VALID" ;;
            401) echo "OPENAI_AUTH=UNAUTHORISED" ;;
            403) echo "OPENAI_AUTH=FORBIDDEN" ;;
            NETWORK_FAILURE) echo "OPENAI_AUTH=NETWORK_HOLD" ;;
            *) echo "OPENAI_AUTH=HTTP_$status" ;;
          esac
      - name: Exact Docker build (NO DEPLOY)
        run: docker build -f deploy/Dockerfile -t jm-sovereign-agent-gateway:m002-candidate .
