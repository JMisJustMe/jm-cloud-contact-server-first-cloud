name: JM CP-C12 - Real RD and separate Postgres backup restore
on:
  push:
    branches:
      - jm/c12-dedicated-custody-restore-20261024
    paths:
      - '.github/workflows/jm-c12-dedicated-custody-transfer.yml'
      - 'qa/c12/**'
      - 'qa/JM_CP_C12_PG_BACKUP_RESTORE_REAL_RD_QA_v0_1.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jm-c12-isolated-custody-restore
  cancel-in-progress: false
jobs:
  actual-independent-postgres-backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      source:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jm_qa
          POSTGRES_PASSWORD: qa123
          POSTGRES_DB: jm_cloud_c12_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jm_qa -d jm_cloud_c12_source"
          --health-interval 5s --health-timeout 3s --health-retries 12
      restore:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jm_qa
          POSTGRES_PASSWORD: qa123
          POSTGRES_DB: jm_cloud_c12_restore
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jm_qa -d jm_cloud_c12_restore"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install inherited pg dependency
        run: npm install --no-audit --no-fund
      - name: Static and fail-closed test authority
        run: |
          node --check qa/JM_CP_C12_PG_BACKUP_RESTORE_REAL_RD_QA_v0_1.mjs
          node --test qa/c12/backup-guard.test.mjs
      - name: REAL host and RD with pg_dump and pg_restore on two separate disposable PostgreSQL containers
        env:
          JM_C12_SOURCE_PG_URL: postgres://jm_qa:qa123@127.0.0.1:5432/jm_cloud_c12_source
          JM_C12_RESTORE_PG_URL: postgres://jm_qa:qa123@127.0.0.1:5433/jm_cloud_c12_restore
          JM_C12_SOURCE_CONTAINER_ID: ${{ job.services.source.id }}
          JM_C12_RESTORE_CONTAINER_ID: ${{ job.services.restore.id }}
          JM_C12_EVIDENCE_PATH: JM_C12_CI_RESULT.json
        run: node qa/JM_CP_C12_PG_BACKUP_RESTORE_REAL_RD_QA_v0_1.mjs
      - name: Preserve NONSECRET witness, never export raw backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jm-c12-real-pg-backup-restore-witness
          if-no-files-found: ignore
          path: JM_C12_CI_RESULT.json
  inherited-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jm_qa
          POSTGRES_PASSWORD: qa123
          POSTGRES_DB: jm_cloud_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jm_qa -d jm_cloud_qa"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: CP-C11 readiness fail-closed regression
        run: node --test qa/c11/cutover-gate.test.mjs
      - name: CP-C11 actual server owner-key fresh-volume recovery
        env:
          JM_QA_POSTGRES_URL: postgres://jm_qa:qa123@localhost:5432/jm_cloud_qa
          JM_C11_EVIDENCE_PATH: JM_C11_RECHECK_C12.json
        run: node qa/JM_CP_C11_FRESH_VOLUME_CUSTODY_QA_v0_1.mjs
      - name: Inherited RD 0.1.2 original regression
        run: node --test qa/c10/bridge/revolving-door-v0_1_2_challenge/test/*.test.mjs
      - name: CP-C10 actual RD runner plus actual Cloud Contact disposable Postgres
        env:
          JM_QA_POSTGRES_URL: postgres://jm_qa:qa123@localhost:5432/jm_cloud_qa
          JM_C10_EVIDENCE_PATH: JM_C10_RECHECK_C12.json
        run: node qa/JM_RD_ACTUAL_HOST_POSTGRES_REAL_RUNNER_QA_v0_1.mjs
      - name: Preserve nonsecret prior-evidence results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jm-c12-inherited-contact-recheck
          if-no-files-found: ignore
          path: |
            JM_C11_RECHECK_C12.json
            JM_C10_RECHECK_C12.json
