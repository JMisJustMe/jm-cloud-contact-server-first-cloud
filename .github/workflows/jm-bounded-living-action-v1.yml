name: JM Bounded Living Action v1

on:
  push:
    branches:
      - jm-bounded-living-action-v1
    paths:
      - ".github/workflows/jm-bounded-living-action-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  living-action:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Execute bounded JM Service Mesh action and verify returned receipts
        env:
          JM_CLOUD: https://jm-cloud-contact-server-v05.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const base=process.env.JM_CLOUD;
          const run=process.env.GITHUB_RUN_ID || String(Date.now());
          const handle=('JMRun'+run).slice(0,24);

          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function req(method,path,token=null,body=null){
            const headers={'accept':'application/json'};
            if(token) headers.authorization='Bearer '+token;
            if(body!==null) headers['content-type']='application/json';
            const r=await fetch(base+path,{method,headers,body:body===null?undefined:JSON.stringify(body)});
            const text=await r.text();
            let j; try{j=JSON.parse(text)}catch{j={raw:text}}
            if(!r.ok) throw new Error(method+' '+path+' -> '+r.status+' '+JSON.stringify(j));
            return j;
          }
          async function waitReady(){
            let last='';
            for(let i=1;i<=50;i++){
              try{
                const r=await fetch(base+'/ready',{headers:{accept:'application/json'}});
                const j=await r.json();
                if(r.ok&&j.ready&&j.receiptSigning) return j;
                last=JSON.stringify(j);
              }catch(e){last=String(e?.message||e)}
              await sleep(3000);
            }
            throw new Error('JM Cloud not ready: '+last);
          }
          function canon(v){
            if(v===null||typeof v!=='object') return JSON.stringify(v);
            if(Array.isArray(v)) return '['+v.map(canon).join(',')+']';
            return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';
          }

          const ready=await waitReady();
          const auth=await req('POST','/mesh/v1/auth/register',null,{handle});
          const token=auth.token;

          const p=await req('POST','/mesh/v2/pipelines',token,{
            source:'A bounded integration action is being executed through an external cloud runner against the existing JM Service Mesh. It must return route-specific evidence before any Ding is claimed.',
            sourceLabel:'JM Bounded Living Action v1',
            lane:'Public Output'
          });
          const pipelineId=p.pipeline.pipelineId;

          const gem=await req('POST','/mesh/v2/pipelines/'+encodeURIComponent(pipelineId)+'/gem',token,{
            gem:'The external cloud runner caused a bounded JM Service Mesh state transition and must receive its own returned evidence.',
            why:'Tests consequence-and-return across an existing JM body without widening authority.',
            keeper:'CONTACT BEFORE CROWN',
            homes:['Build Mesh','Cross-Surface Contact'],
            tags:['bounded-action','route-proof','no-ding-no-claim']
          });

          const claim=await req('POST','/mesh/v2/pipelines/'+encodeURIComponent(pipelineId)+'/claim',token,{
            claim:'This specific workflow route produced a bounded server-side consequence.',
            class:'Testable / falsifiable',
            evidence:'Live HTTP stage responses plus completed pipeline readback and cryptographically verified signed cloud receipt.',
            confidence:'High at this route-specific scope',
            support:'GitHub Actions cloud runner -> public JM Service Mesh -> underlying JM Cloud space.',
            recourse:'Withhold Ding if any stage, readback, hash or signature check fails.',
            radius:'This execution only; no transfer to Codex Remote, GroundZeroJM, phone, or other recipient.'
          });

          const pub=await req('POST','/mesh/v2/pipelines/'+encodeURIComponent(pipelineId)+'/public',token,{
            title:'JM Bounded Living Action v1',
            publicText:'A bounded JM Service Mesh integration test completed through an external cloud execution host and returned route-specific evidence.'
          });

          const trace=await req('GET','/mesh/v2/pipelines/'+encodeURIComponent(pipelineId),token);
          if(trace.pipeline?.stage!=='PUBLIC_OUTPUT'||trace.pipeline?.status!=='complete') throw new Error('pipeline readback is not complete');
          for(const stage of ['collector','gem','claim','public']) if(!trace.pipeline?.packets?.[stage]) throw new Error('missing packet '+stage);

          const meshVerify=await req('POST','/mesh/v1/verify',token,{receiptHash:pub.receipt.receiptHash});
          if(!meshVerify.valid||meshVerify.found!=='mesh') throw new Error('mesh receipt verification failed');

          const cloudReceipt=pub.cloudReceipt;
          if(!cloudReceipt?.publicSig||cloudReceipt.status!=='closed') throw new Error('closed signed cloud receipt missing');
          const snap={
            schema:cloudReceipt.schema,
            spaceId:cloudReceipt.spaceId,
            label:cloudReceipt.label,
            kind:cloudReceipt.kind,
            status:cloudReceipt.status,
            createdAt:cloudReceipt.createdAt,
            updatedAt:cloudReceipt.updatedAt,
            members:cloudReceipt.members,
            eventCount:cloudReceipt.eventCount,
            commandCount:cloudReceipt.commandCount,
            signalCount:cloudReceipt.signalCount,
            chainHead:cloudReceipt.chainHead
          };
          const localHash=crypto.createHash('sha256').update(canon(snap)).digest('hex');
          if(localHash!==cloudReceipt.receiptHash) throw new Error('cloud receipt canonical hash mismatch');

          const key=await req('GET','/receipt-key');
          if(key.keyId!==cloudReceipt.publicKeyId) throw new Error('public key id mismatch');
          const pubKey=crypto.createPublicKey({key:key.publicKeyJwk,format:'jwk'});
          const signature=Buffer.from(cloudReceipt.publicSig,'base64url');
          const signatureValid=crypto.verify('sha256',Buffer.from(cloudReceipt.receiptHash),{key:pubKey,dsaEncoding:'ieee-p1363'},signature);
          if(!signatureValid) throw new Error('ECDSA verification failed');

          const receipt={
            schema:'JM.CrossSurfaceBoundedLivingAction/1',
            status:'DING',
            operationId:'JMOP-a5bc63570970c8d4d92de991',
            executedAt:new Date().toISOString(),
            hostClass:'GitHub Actions cloud runner',
            target:'JM Service Mesh v0.2 on JM CLOUD CONTACT SERVER v0.5.1-hosted',
            route:[
              'CHATGPT AUTHORIZATION',
              'BUILD MESH PLAN_ONLY GATE',
              'GITHUB ACTIONS CLOUD RUNNER',
              'JM SERVICE MESH AUTHUSER',
              'COLLECT',
              'GEM',
              'CLAIM',
              'PUBLIC OUTPUT',
              'UNDERLYING JM CLOUD SPACE CLOSE',
              'MESH RECEIPT VERIFY',
              'CLOUD RECEIPT CANONICAL HASH VERIFY',
              'ECDSA P-256 VERIFY',
              'PIPELINE READBACK'
            ],
            readiness:{serverVersion:ready.version,receiptSigning:ready.receiptSigning},
            pipeline:{
              pipelineId,
              cloudSpaceId:trace.pipeline.cloudSpaceId,
              stage:trace.pipeline.stage,
              status:trace.pipeline.status,
              packetSchema:p.pipeline.packets.collector.schema,
              claimVerdict:claim.packet.payload.verdict,
              releaseState:pub.packet.payload.release_state
            },
            meshReceipt:{receiptHash:pub.receipt.receiptHash,verified:meshVerify.valid},
            cloudReceipt:{
              receiptHash:cloudReceipt.receiptHash,
              localHash,
              hashMatch:localHash===cloudReceipt.receiptHash,
              publicKeyId:cloudReceipt.publicKeyId,
              signatureAlgorithm:cloudReceipt.signatureAlgorithm,
              signatureValid,
              status:cloudReceipt.status,
              eventCount:cloudReceipt.eventCount,
              chainHead:cloudReceipt.chainHead
            },
            readback:{
              complete:trace.pipeline.status==='complete',
              stage:trace.pipeline.stage,
              cloudReceiptHash:trace.pipeline.cloudReceiptHash,
              returnedHashMatches:trace.pipeline.cloudReceiptHash===cloudReceipt.receiptHash
            },
            boundary:'Proves this ChatGPT-authorized GitHub-Actions-cloud -> existing JM Service Mesh -> state change -> closed signed cloud receipt -> returned readback route only. It does not prove Codex Remote, GroundZeroJM, phone, or other recipient routes.'
          };
          if(!receipt.readback.returnedHashMatches) throw new Error('pipeline returned cloud hash mismatch');
          fs.writeFileSync('JM_BOUNDED_LIVING_ACTION_RECEIPT_v1.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt));
          NODE

      - name: Upload bounded living-action receipt
        uses: actions/upload-artifact@v4
        with:
          name: jm-bounded-living-action-v1
          path: JM_BOUNDED_LIVING_ACTION_RECEIPT_v1.json
          if-no-files-found: error
          retention-days: 30
