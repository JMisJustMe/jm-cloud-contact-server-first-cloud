name: JM Living Home — Existing Cloud Contact v05 signed signal proof
on:
  pull_request:
    paths:
      - "JM_CLOUD_CONTACT_SERVER_v0_5_1_HOSTED_DESCENDANT.mjs"
      - "qa/JM_LIVING_HOME_SIGNED_SIGNAL_QA_v0_1.mjs"
      - "package.json"
      - "contact/JM_CLOUD_CONTACT_PG_DURABLE_v0_1.mjs"
      - "contact/JM_CLOUD_CONTACT_CUTOVER_PREFLIGHT_v0_1.mjs"
      - "qa/JM_CLOUD_CONTACT_PG_DURABLE_QA_v0_1.mjs"
      - "deploy/Dockerfile"
      - ".github/workflows/jm-living-home-signed-signal.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-existing-server:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jm_qa
          POSTGRES_PASSWORD: qa123
          POSTGRES_DB: jm_cloud_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jm_qa -d jm_cloud_qa"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Run actual existing v05 server and isolated signed mission-return suite
        run: node qa/JM_LIVING_HOME_SIGNED_SIGNAL_QA_v0_1.mjs
      - name: Retain existing v05 server preflight checks
        run: npm test
      - name: Check read-only hosted cutover preflight source
        run: node --check contact/JM_CLOUD_CONTACT_CUTOVER_PREFLIGHT_v0_1.mjs
      - name: Existing v05 cloud contact durability against disposable PostgreSQL
        env:
          JM_QA_POSTGRES_URL: postgres://jm_qa:qa123@localhost:5432/jm_cloud_qa
        run: node qa/JM_CLOUD_CONTACT_PG_DURABLE_QA_v0_1.mjs
      - name: Build the actual Render Docker carrier with signed contact modules
        run: docker build -f deploy/Dockerfile -t jm-cloud-contact-durable-qa:ci .
