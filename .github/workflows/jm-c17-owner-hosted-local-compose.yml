name: JM CP-C17 owner-hosted self-custody local contact
on:
  push:
    branches:
      - jm/c17-owner-hosted-cloud-20261024
    paths:
      - compose.yaml
      - host/**
      - bridge/**
      - START_HERE_WINDOWS.ps1
      - .github/workflows/jm-c17-owner-hosted-local-compose.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jm-c17-owner-hosted-local-compose
  cancel-in-progress: false
jobs:
  isolated-owner-hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact CP-C16 successor
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static self-host boundaries and inherited signed Revolving Door
        run: |
          node --test host/policy.test.mjs
          node --test bridge/revolving-door-v0_1_2_challenge/test/*.test.mjs
          test "$(git hash-object JM_CLOUD_CONTACT_SERVER_v0_5_1_HOSTED_DESCENDANT.mjs)" = '9c9a2290a81d0ba4f0bbd4e9d955aaa251ae670f'
          test "$(git hash-object contact/JM_CLOUD_CONTACT_WRITER_FENCE_v0_1.mjs)" = '6331e23cb4b446874e58f0ece94879175677e471'
      - name: Generate disposable-only laptop signing and database authorities
        run: node host/generate-owner-config.mjs
      - name: Confirm local-only Docker compose structure
        run: docker compose config --quiet
      - name: Build actual JM cloud and RD from unchanged inherited sources
        run: docker compose build cloud
      - name: Boot two private PostgreSQL services
        run: docker compose up -d --wait contact-db fence-db
      - name: Owner-authorised empty-store custody bootstrap (disposable CI)
        env:
          JM_OWNER_BOOTSTRAP_ACK: I_AM_INITIALIZING_NEW_LOCAL_STORES
        run: docker compose --profile setup run --rm operator node host/init-custody.mjs
      - name: Boot actual Cloud Contact service
        run: docker compose up -d --wait cloud
      - name: Enrol one real probe-only RD member
        run: docker compose --profile setup run --rm operator node host/enroll-probe.mjs
      - name: Boot real RD relay runner and member bridge
        run: docker compose --profile runner up -d rd
      - name: Send first actual signed probe through local host
        run: docker compose --profile reconcile run --rm reconcile node host/send-probe.mjs
      - name: Verify signed Cloud Contact return against real local RD receipt
        run: |
          success=0
          for attempt in 1 2 3 4 5 6; do
            if docker compose --profile reconcile run --rm reconcile node host/reconcile.mjs; then success=1; break; fi
            sleep 4
          done
          test "$success" -eq 1
      - name: Cold restart actual local owner cloud and RD
        run: |
          docker compose --profile runner stop rd cloud
          docker compose --profile runner up -d --wait cloud rd
      - name: Second signed real local probe after persistent recovery
        run: |
          docker compose --profile reconcile run --rm reconcile node host/send-probe.mjs
          success=0
          for attempt in 1 2 3 4 5 6; do
            if docker compose --profile reconcile run --rm reconcile node host/reconcile.mjs; then success=1; break; fi
            sleep 4
          done
          test "$success" -eq 1
      - name: Native PostgreSQL backups for both private stores
        run: |
          docker compose --profile runner stop rd cloud
          docker compose exec -T contact-db pg_dump -Fc -U jm_contact -d jm_contact -f /tmp/owner-c17-state.dump
          docker compose exec -T fence-db pg_dump -Fc -U jm_fence -d jm_fence -f /tmp/owner-c17-fence.dump
          docker compose exec -T contact-db sh -c 'test -s /tmp/owner-c17-state.dump'
          docker compose exec -T fence-db sh -c 'test -s /tmp/owner-c17-fence.dump'
      - name: Preserve public-scope evidence ONLY, never keys or backups
        if: always()
        run: |
          node -e "require('fs').writeFileSync('JM_CP_C17_CI_SCOPE.json',JSON.stringify({schema:'jm.cp-c17.owner-hosted-ci/1',scope:'disposable-GitHub-docker-Compose',originalSourceRetained:true,productionCredentials:false,renderTouched:false,ownerLaptopTested:false,samsungFoldTested:false,privateSignerIncluded:false},null,2))"
      - name: Upload nonsecret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jm-c17-owner-hosted-local-compose-proof
          if-no-files-found: ignore
          path: JM_CP_C17_CI_SCOPE.json
      - name: Stop disposable services without deleting volumes
        if: always()
        run: docker compose --profile runner --profile setup --profile reconcile down --remove-orphans || true
