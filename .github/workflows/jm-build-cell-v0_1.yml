name: JM Build Cell v0.1

on:
  push:
    branches:
      - jm-build-cell-v0.1
  workflow_dispatch:

jobs:
  build-cell-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build Cell descendant
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Cell syntax
        run: node --check build/JM_BUILD_CELL_PROFILE_v0_1.mjs
      - name: Exact JM compiler route QA
        run: node qa/JM_BUILD_CELL_QA_v0_1.mjs
