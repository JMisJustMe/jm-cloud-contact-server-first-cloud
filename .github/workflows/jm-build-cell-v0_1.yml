name: JM Build Cell v0.1

on:
  push:
    branches:
      - jm-build-cell-v0.1
  workflow_dispatch:

jobs:
  build-cloud-full-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build Cloud descendant
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install hosted dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Full JM cloud + Compute Cell + Build Cell suite
        run: npm test
