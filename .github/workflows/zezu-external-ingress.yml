name: zezu.nwona external ingress proof

on:
  push:
    branches:
      - hosted-v0.5-descendant
    paths:
      - ".github/workflows/zezu-external-ingress.yml"
      - "zezu/**"
      - "JM_CLOUD_CONTACT_SERVER_v0_5_1_HOSTED_DESCENDANT.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact hosted descendant
        uses: actions/checkout@v4

      - name: Public POST -> server store -> public GET -> exact return
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const source=fs.readFileSync('zezu/fixtures/ZEZU_NWONA_PORTABLE_HISTORY_CAPSULE_v0_5.json');
          const expected='58d6cbd2ce62325b6ba75cacdd0e50949a5a05eef5e1946d8d9190ccc6b1b38f';
          const base='https://jm-cloud-contact-server-v05.onrender.com';
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const fail=(m,x)=>{console.error(m,x??'');process.exit(1)};
          (async()=>{
            const sourceSha=sha(source);
            if(sourceSha!==expected) fail('source SHA mismatch',sourceSha);

            const post=await fetch(base+'/zezu/v1/history',{
              method:'POST',
              headers:{'content-type':'application/json','user-agent':'JM-zezu-external-proof/GitHub-Actions'},
              body:JSON.stringify({carrierBase64:source.toString('base64')})
            });
            const pj=await post.json();
            if(post.status!==201||!pj.ok) fail('public POST failed',{status:post.status,body:pj});

            const get=await fetch(base+'/zezu/v1/history/'+encodeURIComponent(pj.historyId),{
              headers:{'user-agent':'JM-zezu-external-proof/GitHub-Actions'}
            });
            const gj=await get.json();
            if(get.status!==200||!gj.ok) fail('public GET failed',{status:get.status,body:gj});

            const returned=Buffer.from(gj.carrierBase64,'base64');
            const returnedSha=sha(returned);
            const exact=Buffer.compare(source,returned)===0;

            const tampered=Buffer.from(source);
            tampered[tampered.length-2]^=1;
            const bad=await fetch(base+'/zezu/v1/history',{
              method:'POST',
              headers:{'content-type':'application/json','user-agent':'JM-zezu-external-proof/GitHub-Actions'},
              body:JSON.stringify({carrierBase64:tampered.toString('base64')})
            });

            const proof={
              schema:'zezu.nwona.external-public-ingress-proof/0.8',
              status: exact && returnedSha===expected && bad.status===422 ? 'PASS':'FAIL',
              source:'GitHub Actions hosted runner',
              destination:base,
              route:'EXTERNAL RUNNER -> PUBLIC HTTPS POST -> RENDER SERVER VERIFY/STORE -> PUBLIC HTTPS GET -> EXTERNAL RUNNER',
              historyId:pj.historyId,
              sourceBytes:source.length,
              returnedBytes:returned.length,
              sourceSha256:sourceSha,
              returnedSha256:returnedSha,
              exactByteMatch:exact,
              ledgerRoot:gj.verification?.ledgerRoot||null,
              continuationRoot:gj.verification?.continuationRoot||null,
              blockedReceiptsExcludedFromContinuation:gj.verification?.blockedReceiptsExcludedFromContinuation===true,
              serverReceiptHash:gj.receipt?.receiptHash||null,
              serverSigPresent:!!gj.receipt?.serverSig,
              tamperedCarrierPublicStatus:bad.status,
              runId:process.env.GITHUB_RUN_ID||null,
              commit:process.env.GITHUB_SHA||null
            };
            fs.writeFileSync('ZEZU_EXTERNAL_INGRESS_PROOF_v0_8.json',JSON.stringify(proof,null,2)+'\n');
            console.log('JM_ZEZU_EXTERNAL_INGRESS_PROOF '+JSON.stringify(proof));
            if(proof.status!=='PASS') process.exit(1);
          })().catch(e=>fail(e.stack||String(e)));
          NODE

      - name: Upload external proof receipt
        uses: actions/upload-artifact@v4
        with:
          name: zezu-external-ingress-proof
          path: ZEZU_EXTERNAL_INGRESS_PROOF_v0_8.json
          if-no-files-found: error
