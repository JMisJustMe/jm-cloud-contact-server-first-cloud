name: CP18 JM Domino Inherited V5 Integration
on:
  pull_request:
    branches: [hosted-v0.5-descendant]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-passby:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only inherited server dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: JM CP18 domino signed readback against actual inherited hosted v5
        run: node --test CP18/jmcc-v5-passby.test.mjs CP18/jmcc-inherited-passbys.test.mjs
      - name: Existing hosted v5 regression suite
        run: npm test
