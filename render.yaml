services:
  - type: web
    name: jm-cloud-contact-server
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    autoDeploy: false
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    disk:
      name: jm-sovereign-gateway-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: JM_GATEWAY_CLIENT_TOKEN
        generateValue: true
      - key: JM_GATEWAY_AUTHORITY_TOKEN
        generateValue: true
      - key: JM_GATEWAY_ACP_TOKEN
        generateValue: true
      - key: JM_GATEWAY_DATA
        value: /data/JM_SOVEREIGN_AGENT_GATEWAY_STORE_v0_2.json
      - key: JM_GATEWAY_ACP_ENABLED
        value: "true"
      - key: JM_GATEWAY_DURABILITY_TIER
        value: RENDER_PERSISTENT_DISK_CONFIGURED_NOT_YET_RESTART_PROVEN
