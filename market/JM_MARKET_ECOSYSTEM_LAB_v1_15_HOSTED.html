<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>JM MARKET ECOSYSTEM LAB v1.15</title>
<style>
:root{--bg:#090d12;--panel:#101722;--panel2:#162131;--ink:#f2f7ff;--muted:#91a2ba;--line:#26364d;--good:#52df8a;--warn:#ffd166;--bad:#ff7070;--accent:#78b8ff;--purple:#c68cff}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:18px 18px 12px;border-bottom:1px solid var(--line);background:rgba(9,13,18,.97);position:sticky;top:0;z-index:9}
h1{font-size:clamp(20px,5vw,30px);margin:0 0 4px}.sub{font-size:12px;color:var(--muted);line-height:1.5}
.routebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:11px}.routebar .m{background:#0d1520;border:1px solid var(--line);border-radius:10px;padding:8px}.routebar b{display:block;font-size:16px}.routebar small{display:block;color:var(--muted);font-size:9px;margin-top:2px}
nav{display:flex;gap:8px;overflow:auto;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:116px;z-index:8;background:rgba(9,13,18,.98);scrollbar-width:none}nav::-webkit-scrollbar{display:none}
button,.btn,select,input{font:inherit}button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;white-space:nowrap}button.active,button:hover{border-color:var(--accent);background:#1a2a41}
main{max-width:1400px;margin:auto;padding:14px}.tab{display:none}.tab.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:11px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.card h2,.card h3{margin:0 0 10px}.card h2{font-size:18px}.card h3{font-size:14px}.kpi{font-size:30px;font-weight:800;line-height:1.05}.muted{color:var(--muted)}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.purple{color:var(--purple)}
label{display:block;font-size:11px;color:var(--muted);margin:8px 0 4px}input,select,textarea{width:100%;background:#0c131c;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px}textarea{min-height:90px}.row{display:grid;grid-template-columns:repeat(12,1fr);gap:9px}.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
table{width:100%;border-collapse:collapse;font-size:11px}th,td{border-bottom:1px solid var(--line);padding:7px;text-align:left;vertical-align:top}th{color:#c7dcf7;position:sticky;top:0;background:var(--panel)}
.scroll{overflow:auto;max-height:520px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:10px;margin:2px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.small{font-size:11px}.meter{height:8px;background:#0b121a;border-radius:999px;overflow:hidden;border:1px solid var(--line)}.meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good));width:0}.stamp{font-size:10px;color:var(--muted)}pre{white-space:pre-wrap;background:#0c131c;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px}
.edgepos{font-weight:800;color:var(--good)}.edgeneg{font-weight:800;color:var(--bad)}
@media(max-width:760px){header{position:relative}.routebar{grid-template-columns:repeat(2,1fr)}nav{top:0}.c2,.c3,.c4,.c6,.c8{grid-column:span 12}main{padding:12px}.card{border-radius:14px}}
</style>
</head>
<body>
<header>
<h1>JM MARKET ECOSYSTEM LAB v1.15</h1>
<div class="sub">MARKETPLACE OF MARKETS · mismatched clocks · cross-field propagation · executable quotes · friction-aware paper proof · £0 required</div>
<div class="routebar">
 <div class="m"><b id="progressPct">40%</b><small>HOSTED ROUTE</small></div>
 <div class="m"><b id="elapsed">00:00</b><small>SESSION DURATION</small></div>
 <div class="m"><b id="obsCount">0</b><small>TRACE OBSERVATIONS</small></div>
 <div class="m"><b id="stage">HOSTED CONTACT</b><small>CURRENT STAGE</small></div>
</div>
</header>
<nav id="tabs"></nav>
<main>
<section id="overview" class="tab active"></section>
<section id="live" class="tab"></section>
<section id="mesh" class="tab"></section>
<section id="history" class="tab"></section>
<section id="paper" class="tab"></section>
<section id="trace" class="tab"></section>
<section id="protocol" class="tab"></section>
</main>
<script>
const START=Date.now(), KEY='jm_market_lab_v115';
const EDGES=[
['AI compute','Foundry capacity','demand','MID'],['AI compute','HBM / memory','demand','MID'],['AI compute','Hyperscaler capex','demand','MID'],['AI compute','Power & cooling','demand','SLOW'],
['Foundry','Semicap equipment','demand','MID'],['Foundry','Advanced packaging','constraint','MID'],['Foundry','Memory demand','demand','MID'],['Foundry','Cloud / AI buildout','demand','MID'],
['Memory','GPU/server availability','constraint','MID'],['Memory','Server cost','cost','MID'],['Memory','Cloud margins','cost','MID'],['Memory','Fabrication capex','demand','SLOW'],
['Electricity','Data centres','capacity','SLOW'],['Electricity','Grid equipment','capacity','SLOW'],['Electricity','Fuel prices','cost','FAST'],['Electricity','Regulation / permits','constraint','SLOW'],
['Copper / metals','Grid build','input','MID'],['Copper / metals','EV build','input','MID'],['Copper / metals','Mine/refinery disruption','supply','FAST'],['Copper / metals','Equipment build cost','cost','MID'],
['Oil / logistics','Bunker fuel','cost','FAST'],['Oil / logistics','Shipping rates','cost','MID'],['Oil / logistics','Imported goods','cost','SLOW'],['Oil / logistics','Inflation / rates','macro','SLOW'],
['UK consumer','Food commodities','input','SLOW'],['UK consumer','Energy / freight','cost','SLOW'],['UK consumer','Wages / regulation','cost','SLOW'],['UK consumer','Household pressure','demand','SLOW'],
['Money / liquidity','Gold','rates/USD','FAST'],['Money / liquidity','Crypto / risk','liquidity','FAST'],['Money / liquidity','FX','rates','FAST'],['Money / liquidity','Equity multiples','discount-rate','MID']
];
let S={traces:[],histRuns:[],rows:[],lastQuotes:null,settings:{pair:'BTC/GBP',feeA:20,feeB:20,other:5,notional:1000,refresh:15}};
try{S={...S,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}
const $=id=>document.getElementById(id), save=()=>{localStorage.setItem(KEY,JSON.stringify({...S,rows:[]})); updateHud()};
const fmt=(x,n=4)=>Number.isFinite(+x)?(+x).toFixed(n):'—', mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:NaN;
const median=a=>{if(!a.length)return NaN;let b=[...a].sort((x,y)=>x-y),m=Math.floor(b.length/2);return b.length%2?b[m]:(b[m-1]+b[m])/2};
const corr=(a,b)=>{let n=Math.min(a.length,b.length);if(n<3)return NaN;let A=a.slice(0,n),B=b.slice(0,n),ma=mean(A),mb=mean(B),u=0,x=0,y=0;for(let i=0;i<n;i++){let da=A[i]-ma,db=B[i]-mb;u+=da*db;x+=da*da;y+=db*db}return x&&y?u/Math.sqrt(x*y):NaN};
const esc=x=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pct=(a,b)=>a?b/a-1:NaN;
function updateHud(){let sec=Math.floor((Date.now()-START)/1000),m=Math.floor(sec/60),s=sec%60;$('elapsed').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('obsCount').textContent=(S.cloud?.snapshotCount||0)+S.traces.length}
async function syncPulse(){try{let [pr,rr]=await Promise.all([fetch('/market/v1/pulse',{cache:'no-store'}),fetch('/market/v1/ready',{cache:'no-store'})]),p=await pr.json(),r=await rr.json();S.cloud=p;let gates=[true,!!r.ready,!!p.venues?.kraken?.lastSuccessAt,!!p.venues?.coinbase?.lastSuccessAt,(p.snapshotCount||0)>0],pct=Math.round(gates.filter(Boolean).length/gates.length*100);$('progressPct').textContent=pct+'%';$('stage').textContent=p.externalQuoteContact==='earned-runtime-data-contact'?'LIVE OBSERVE':'HOSTED CONTACT';if($('pulsePanel'))$('pulsePanel').innerHTML=renderPulse(p);updateHud()}catch(e){if($('pulsePanel'))$('pulsePanel').innerHTML='<span class="bad">Pulse status unavailable: '+esc(e.message)+'</span>'}}
function renderPulse(p){if(!p)return '<span class="muted">No pulse state.</span>';let age=p.lastRunAt?Math.max(0,Math.round((Date.now()-Date.parse(p.lastRunAt))/1000)):null;return '<div class="grid">'+card('Autonomous collector','<div class="kpi '+(p.enabled?'good':'warn')+'">'+(p.enabled?'ON':'OFF')+'</div><div class="muted">'+fmt(p.intervalMs/1000,0)+' sec cadence · '+esc((p.pairs||[]).join(', '))+'</div>')+card('Cloud observations','<div class="kpi">'+(p.snapshotCount||0)+'</div><div class="muted">last run '+(age==null?'—':age+'s ago')+' · '+fmt(p.lastRunDurationMs,0)+' ms</div>')+card('Kraken contact','<div class="kpi '+(p.venues?.kraken?.lastSuccessAt?'good':'warn')+'">'+(p.venues?.kraken?.lastSuccessAt?'DING':'WAIT')+'</div><div class="muted">'+esc(p.venues?.kraken?.lastSuccessAt||p.venues?.kraken?.lastError||'awaiting contact')+'</div>')+card('Coinbase contact','<div class="kpi '+(p.venues?.coinbase?.lastSuccessAt?'good':'warn')+'">'+(p.venues?.coinbase?.lastSuccessAt?'DING':'WAIT')+'</div><div class="muted">'+esc(p.venues?.coinbase?.lastSuccessAt||p.venues?.coinbase?.lastError||'awaiting contact')+'</div>')+'</div>'}
async function loadCloudHistory(){try{let r=await fetch('/market/v1/snapshots?limit=5000',{cache:'no-store'}),j=await r.json(),rows=[];(j.snapshots||[]).forEach(q=>{let t=Date.parse(q.fetchedAt),k=q.venues?.kraken,c=q.venues?.coinbase;if(k?.ok)rows.push({timestamp:t,series:q.symbol+'::Kraken.mid',value:(k.bid+k.ask)/2});if(c?.ok)rows.push({timestamp:t,series:q.symbol+'::Coinbase.mid',value:(c.bid+c.ask)/2});if(Number.isFinite(q.bestRawBps))rows.push({timestamp:t,series:q.symbol+'::bestRawBps',value:q.bestRawBps});if(Number.isFinite(q.bestTopCapacity))rows.push({timestamp:t,series:q.symbol+'::bestTopCapacity',value:q.bestTopCapacity})});S.rows=rows.sort((a,b)=>a.timestamp-b.timestamp);$('csvmsg').innerHTML='<span class="good">Loaded '+S.rows.length+' derived historical rows from '+(j.snapshots||[]).length+' cloud snapshots.</span>';setSelectors();overview()}catch(e){$('csvmsg').innerHTML='<span class="bad">'+esc(e.message)+'</span>'}}
setInterval(syncPulse,15000);
setInterval(updateHud,1000);
const tabs=[['overview','Overview'],['live','Live Mesh'],['mesh','32-Mesh'],['history','Historical Lab'],['paper','Paper Edge'],['trace','Trace'],['protocol','Protocol']];
$('tabs').innerHTML=tabs.map((x,i)=>'<button data-t="'+x[0]+'" class="'+(i?'':'active')+'">'+x[1]+'</button>').join('');
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$(b.dataset.t).classList.add('active')});

function overview(){
 $('overview').innerHTML='<div class="grid">'+
  card('Seed topology','<div class="kpi good">32/32</div><div class="muted">relationship routes loaded</div>')+
  card('Live carrier','<div class="kpi good">CLOUD</div><div class="muted">same-origin JM server route</div>')+
  card('Historical rows','<div class="kpi">'+S.rows.length+'</div><div class="muted">current imported session</div>')+
  card('Real capital','<div class="kpi good">£0</div><div class="muted">paper-first by construction</div>')+
  '</div>'+
  '<div class="card" style="margin-top:11px"><h3>Operational route</h3><div class="mono">SOURCE → SIGNAL → CONTACT FIELD → ROUTE PRESSURE → STATE CHANGE → DING → TRACE → RECOVERY → OUTPUT</div><p class="muted">The lab promotes relationships, not stories. Historical survival advances to live paper contact; live paper survival advances only to a separate capital decision.</p></div>'+
  '<div class="card" style="margin-top:11px"><h3>Three clocks</h3><span class="pill">FAST · seconds → hours</span><span class="pill">MID · hours → weeks</span><span class="pill">SLOW · weeks → months</span><p class="muted">Primary hunt: <b>mismatched clocks</b> — connected fields receiving the same pressure at different speeds.</p></div>';
}
function card(h,b){return '<div class="card"><h3>'+h+'</h3>'+b+'</div>'}

let timer=null;
function live(){
 const q=S.lastQuotes;
 $('live').innerHTML='<div class="row"><div class="card c4"><h3>Live pair</h3><label>Pair</label><select id="pair"><option>BTC/GBP</option><option>ETH/GBP</option><option>BTC/USD</option><option>ETH/USD</option></select><div class="row"><div class="c6"><label>Kraken fee bps</label><input id="feeA" type="number" step=".1" value="'+S.settings.feeA+'"></div><div class="c6"><label>Coinbase fee bps</label><input id="feeB" type="number" step=".1" value="'+S.settings.feeB+'"></div><div class="c6"><label>Other friction bps</label><input id="other" type="number" step=".1" value="'+S.settings.other+'"></div><div class="c6"><label>Paper capital £/$</label><input id="notional" type="number" value="'+S.settings.notional+'"></div><div class="c12"><label>Auto refresh</label><select id="refresh"><option value="0">Off</option><option value="5">5 sec</option><option value="15">15 sec</option><option value="30">30 sec</option><option value="60">60 sec</option></select></div></div><button id="scan" style="margin-top:9px">Scan both venues now</button> <button id="sweep" style="margin-top:9px">Full-depth sweep</button><div id="liveStatus" class="small muted" style="margin-top:8px">Ready.</div></div>'+
 '<div class="card c8"><h3>Executable quote contact</h3><div id="quoteGrid">'+renderQuoteGrid(q)+'</div><div id="edgeBox" style="margin-top:10px">'+renderEdge(q)+'</div><div id="sweepBox" style="margin-top:10px"></div></div></div>'+
 '<div class="card" style="margin-top:11px"><h3>Cloud pulse</h3><div id="pulsePanel" class="muted">Loading autonomous collector…</div><button id="pulseRefresh" style="margin-top:8px">Refresh cloud pulse</button></div>'+ '<div class="card" style="margin-top:11px"><h3>Live-contact law</h3><p class="muted">Headline price is ignored. Direction A→B uses <b>A ask</b> to enter and <b>B bid</b> to exit. Reverse uses B ask → A bid. Fees and user-set extra friction are removed before any paper edge is recorded.</p></div>';
 $('pair').value=S.settings.pair;$('refresh').value=String(S.settings.refresh);
 $('scan').onclick=scan;$('sweep').onclick=sweepDepth;$('pulseRefresh').onclick=syncPulse;setTimeout(syncPulse,0);
 $('refresh').onchange=e=>{S.settings.refresh=+e.target.value;save();armTimer()};
 ['pair','feeA','feeB','other','notional'].forEach(id=>$(id).onchange=()=>{S.settings.pair=$('pair').value;S.settings.feeA=+$('feeA').value;S.settings.feeB=+$('feeB').value;S.settings.other=+$('other').value;S.settings.notional=+$('notional').value;save()});
}
function renderQuoteGrid(q){
 if(!q)return '<div class="muted">No live snapshot yet.</div>';
 let k=q.venues?.kraken,c=q.venues?.coinbase;
 return '<div class="grid">'+quoteCard('Kraken',k)+quoteCard('Coinbase',c)+'</div><div class="stamp">Server fetched '+esc(q.fetchedAt||'—')+' · symbol '+esc(q.symbol||'')+'</div>';
}
function quoteCard(name,x){
 if(!x||!x.ok)return card(name,'<div class="bad">Unavailable</div><div class="small muted">'+esc(x?.error||'no quote')+'</div>');
 return card(name,'<div class="row"><div class="c6"><span class="muted small">BID</span><div class="kpi">'+fmt(x.bid,2)+'</div><div class="small muted">size '+fmt(x.bidSize,6)+' · top capacity '+fmt(x.bidQuoteCapacity,2)+'</div></div><div class="c6"><span class="muted small">ASK</span><div class="kpi">'+fmt(x.ask,2)+'</div><div class="small muted">size '+fmt(x.askSize,6)+' · top capacity '+fmt(x.askQuoteCapacity,2)+'</div></div></div><div class="small muted">spread '+fmt((x.ask/x.bid-1)*10000,2)+' bps · server fetch '+fmt(x.durationMs,0)+' ms</div>');
}
function edge(q){
 if(!q?.venues?.kraken?.ok||!q?.venues?.coinbase?.ok)return null;
 let k=q.venues.kraken,c=q.venues.coinbase,fa=+S.settings.feeA,fb=+S.settings.feeB,o=+S.settings.other,n=+S.settings.notional;
 let a=[{route:'Kraken → Coinbase',buy:k.ask,sell:c.bid,capacity:Math.min(k.askQuoteCapacity||0,c.bidQuoteCapacity||0)},{route:'Coinbase → Kraken',buy:c.ask,sell:k.bid,capacity:Math.min(c.askQuoteCapacity||0,k.bidQuoteCapacity||0)}].map(x=>{let raw=(x.sell/x.buy-1)*10000,net=raw-fa-fb-o;return {...x,raw,net,pnl:n*net/10000,fits:n<=x.capacity}});
 a.sort((x,y)=>y.net-x.net);return a[0];
}
function renderEdge(q){
 let e=edge(q);if(!e)return '<div class="muted">Need both executable bid/ask quotes.</div>';
 return '<div class="grid">'+card('Best direction','<div class="kpi">'+e.route+'</div><div class="muted">buy '+fmt(e.buy,2)+' → sell '+fmt(e.sell,2)+'</div>')+card('Raw gap','<div class="kpi">'+fmt(e.raw/100,4)+'%</div><div class="muted">'+fmt(e.raw,2)+' bps</div>')+card('Top-book capacity','<div class="kpi '+(e.fits?'good':'bad')+'">'+fmt(e.capacity,2)+'</div><div class="muted">paper notional '+fmt(S.settings.notional,0)+' · '+(e.fits?'FITS TOP LEVEL':'DOES NOT FIT')+'</div>')+card('After friction + size','<div class="kpi '+(e.net>0&&e.fits?'good':'bad')+'">'+fmt(e.net/100,4)+'%</div><div class="muted">'+fmt(e.net,2)+' bps · '+(e.fits?((e.pnl>=0?'+':'')+fmt(e.pnl,2)):'capacity gate blocks')+'</div>')+'</div>';
}
function renderSweep(j){
 if(!j?.routes?.length)return '<div class="bad">No filled depth route.</div>';
 let fee=+S.settings.feeA+ +S.settings.feeB+ +S.settings.other,n=+S.settings.notional,best=[...j.routes].filter(x=>x.filled).sort((a,b)=>b.grossBps-a.grossBps)[0];
 if(!best)return '<div class="bad">Requested notional could not be filled through returned depth on both venues.</div>';
 let net=best.grossBps-fee,pnl=n*net/10000;
 return '<div class="card"><h3>Full-depth result</h3><div class="grid">'+card('Route','<div class="kpi">'+esc(best.route)+'</div><div class="muted">base '+fmt(best.baseQty,8)+'</div>')+card('Buy VWAP','<div class="kpi">'+fmt(best.buyVWAP,4)+'</div><div class="muted">'+best.buyLevelsUsed+' book levels</div>')+card('Sell VWAP','<div class="kpi">'+fmt(best.sellVWAP,4)+'</div><div class="muted">'+best.sellLevelsUsed+' book levels</div>')+card('Gross after depth','<div class="kpi '+(best.grossBps>0?'warn':'bad')+'">'+fmt(best.grossBps/100,4)+'%</div><div class="muted">'+fmt(best.grossBps,2)+' bps · skew '+fmt(j.receiveSkewMs,0)+' ms</div>')+card('Net after assumptions','<div class="kpi '+(net>0?'good':'bad')+'">'+fmt(net/100,4)+'%</div><div class="muted">'+fmt(net,2)+' bps · '+(pnl>=0?'+':'')+fmt(pnl,2)+' on '+fmt(n,0)+'</div>')+'</div><p class="small muted">Depth VWAP is stronger evidence than top-of-book, but still assumes the captured books remain available through execution and excludes account-specific transfer/inventory/tax constraints beyond the friction values entered here.</p></div>';
}
async function sweepDepth(){
 S.settings.pair=$('pair').value;S.settings.feeA=+$('feeA').value;S.settings.feeB=+$('feeB').value;S.settings.other=+$('other').value;S.settings.notional=+$('notional').value;save();
 $('sweepBox').innerHTML='<div class="muted">Walking both public order books…</div>';let t=performance.now();
 try{let r=await fetch('/market/v1/sweep?symbol='+encodeURIComponent(S.settings.pair)+'&notional='+encodeURIComponent(S.settings.notional),{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||('HTTP '+r.status));$('sweepBox').innerHTML=renderSweep(j);let best=[...(j.routes||[])].filter(x=>x.filled).sort((a,b)=>b.grossBps-a.grossBps)[0],net=best?best.grossBps-S.settings.feeA-S.settings.feeB-S.settings.other:null;S.traces.unshift({kind:'FULL_DEPTH_SWEEP',at:new Date().toISOString(),pair:S.settings.pair,notional:S.settings.notional,clientMs:Math.round(performance.now()-t),best,netBps:net,receiveSkewMs:j.receiveSkewMs});S.traces=S.traces.slice(0,3000);save();trace()}catch(e){$('sweepBox').innerHTML='<div class="bad">'+esc(e.message)+'</div>'}
}
async function scan(){
 S.settings.pair=$('pair').value;S.settings.feeA=+$('feeA').value;S.settings.feeB=+$('feeB').value;S.settings.other=+$('other').value;S.settings.notional=+$('notional').value;save();
 $('liveStatus').textContent='Contacting JM cloud route…';let t=performance.now();
 try{let r=await fetch('/market/v1/quotes?symbol='+encodeURIComponent(S.settings.pair),{cache:'no-store'}),j=await r.json();if(!r.ok&&!j.venues)throw Error(j.error||('HTTP '+r.status));S.lastQuotes=j;let e=edge(j),rec={kind:'LIVE_PAPER_SCAN',at:new Date().toISOString(),pair:S.settings.pair,serverFetchedAt:j.fetchedAt,roundTripClientMs:Math.round(performance.now()-t),settings:{...S.settings},edge:e,venues:j.venues};S.traces.unshift(rec);S.traces=S.traces.slice(0,3000);save();$('quoteGrid').innerHTML=renderQuoteGrid(j);$('edgeBox').innerHTML=renderEdge(j);$('liveStatus').innerHTML=e&&e.net>0&&e.fits?'<span class="warn">Positive size-qualified paper candidate detected — NOT a money Ding.</span>':'<span class="good">Scan recorded. Net and/or top-book size gate did not pass.</span>';trace();overview()}
 catch(err){$('liveStatus').innerHTML='<span class="bad">'+esc(err.message)+'</span>'}
}
function armTimer(){if(timer)clearInterval(timer);if(S.settings.refresh>0)timer=setInterval(()=>{if($('live').classList.contains('active'))scan()},S.settings.refresh*1000)}
armTimer();

async function mesh(){
 $('mesh').innerHTML='<div class="card"><h3>32 seeded routes · measurement coverage</h3><div class="muted">Loading coverage registry…</div></div>';

function parseCSV(txt){
 let lines=txt.trim().split(/\r?\n/);if(lines.length<2)return[];const row=line=>{let a=[],c='',q=false;for(let i=0;i<line.length;i++){let x=line[i];if(x==='"'){if(q&&line[i+1]==='"'){c+='"';i++}else q=!q}else if(x===','&&!q){a.push(c);c=''}else c+=x}a.push(c);return a};let h=row(lines[0]).map(x=>x.trim().toLowerCase());['timestamp','series','value'].forEach(k=>{if(!h.includes(k))throw Error('Missing '+k)});return lines.slice(1).map(l=>{let c=row(l),o={};h.forEach((k,i)=>o[k]=c[i]);return{timestamp:new Date(o.timestamp).getTime(),series:o.series,value:+o.value}}).filter(x=>Number.isFinite(x.timestamp)&&x.series&&Number.isFinite(x.value)).sort((a,b)=>a.timestamp-b.timestamp)
}
function history(){
 $('history').innerHTML='<div class="card" style="margin-bottom:11px"><h3>Mismatched-clock quantifier</h3><p class="small muted">Fetch two whitelisted historical series on the server. Rates/yields become basis-point changes; prices, indexes and FX become percentage returns. The lag is chosen on the first 60% only, frozen, then tested on the next 20% and untouched final 20%.</p><div class="row"><div class="c3"><label>Source A</label><select id="clockSourceA"></select></div><div class="c3"><label>Series A · pressure</label><select id="clockSeriesA"></select></div><div class="c3"><label>Source B</label><select id="clockSourceB"></select></div><div class="c3"><label>Series B · response</label><select id="clockSeriesB"></select></div><div class="c3"><label>From</label><input id="clockFrom" type="date" value="2021-01-01"></div><div class="c3"><label>To</label><input id="clockTo" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="c2"><label>Max lag bars</label><input id="clockLag" type="number" value="20" min="0" max="90"></div><div class="c2"><label>Signal threshold · native unit</label><input id="clockThr" type="number" value="" step=".1" placeholder="registry default"></div><div class="c2"><label>Friction bps</label><input id="clockFric" type="number" value="20" step=".1"></div><div class="c12"><button id="clockRun">Quantify mismatched clock</button></div></div><div id="clockMeta" style="margin-top:7px" class="small muted">Series transforms load from the source registry.</div><div id="clockOut" style="margin-top:9px" class="small muted">Choose a pressure series and a response series.</div></div><div class="card" style="margin-bottom:11px"><h3>Cloud historical source library</h3><div class="row"><div class="c3"><label>Source</label><select id="histSource"></select></div><div class="c3"><label>Series</label><select id="histSeries"></select></div><div class="c2"><label>From</label><input id="histFrom" type="date" value="2021-01-01"></div><div class="c2"><label>To</label><input id="histTo" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="c2"><label>&nbsp;</label><button id="remoteHist">Load series</button></div></div><div id="remoteMsg" class="small muted" style="margin-top:7px">Loading source registry…</div></div><div class="row"><div class="card c6"><h3>Import timestamped history</h3><p class="small muted">CSV: <span class="mono">timestamp,series,value</span>. Or pull the cloud pulse history already gathered by this server.</p><button id="cloudHist">Load cloud pulse history</button><input id="csv" type="file" accept=".csv,text/csv"><div id="csvmsg" class="small muted" style="margin-top:7px"></div></div><div class="card c6"><h3>Generic CSV price-return lab</h3><p class="small muted">This local import lane treats both series as percentage-return series. Use the server quantifier above for rates/yields or mixed-unit relationships.</p><div class="row"><div class="c6"><label>Source</label><select id="src"></select></div><div class="c6"><label>Target</label><select id="dst"></select></div><div class="c4"><label>Max lag bars</label><input id="lag" type="number" value="12" min="1"></div><div class="c4"><label>Signal threshold %</label><input id="thr" type="number" value=".5" step=".1"></div><div class="c4"><label>Round-trip friction bps</label><input id="hfric" type="number" value="20" step=".1"></div></div><button id="runHist" style="margin-top:8px">Run 60/20/20 test</button></div></div><div id="histOut" style="margin-top:11px"></div>';

 initHistorySources();$('prospectiveRun').onclick=runProspective;$('confirmRun').onclick=runFrozenConfirm;$('rarityRun').onclick=runLagRarity;$('nullRun').onclick=runNullField;$('stressRun').onclick=runStress;$('clockRun').onclick=runClockTest;$('cloudHist').onclick=loadCloudHistory;$('remoteHist').onclick=loadRemoteHistory;$('csv').onchange=async e=>{try{S.rows=parseCSV(await e.target.files[0].text());$('csvmsg').innerHTML='<span class="good">Loaded '+S.rows.length+' observations across '+names().length+' series.</span>';setSelectors();overview()}catch(err){$('csvmsg').innerHTML='<span class="bad">'+esc(err.message)+'</span>'}};

(j.test.associationHitRate*100,1)+'% · n='+j.test.n+'</div>')+card('Paper layer','<div class="kpi '+(j.paperSurvivalCandidate?'warn':'good')+'">'+(vp&&tp?(j.paperSurvivalCandidate?'SURVIVED':'NO PASS'):'N/A')+'</div><div class="muted">'+(vp&&tp?('validation '+fmt(vp.mean*100,3)+'% · test '+fmt(tp.mean*100,3)+'% · '+j.frictionBps+' bps friction'):'Target is not a price/index/FX return series; friction is not applied.')+'</div>')+'</div>'+card('Clock gate','<span class="'+cls+'"><b>'+state+'</b></span><p class="small muted">'+esc(j.transformBoundary)+' '+esc(j.resolutionBoundary)+' '+esc(j.claimBoundary)+'</p>');S.traces.unshift({kind:'MISMATCHED_CLOCK_TEST',at:new Date().toISOString(),clientMs:Math.round(performance.now()-t),...j});S.traces=S.traces.slice(0,3000);save();trace()}catch(e){$('clockOut').innerHTML='<span class="bad">'+esc(e.message)+'</span>'}}

function names(){return[...new Set(S.rows.map(x=>x.series))]}
function setSelectors(){let o=names().map(x=>'<option>'+esc(x)+'</option>').join('');if($('src'))$('src').innerHTML=o;if($('dst')){$('dst').innerHTML=o;if($('dst').options.length>1)$('dst').selectedIndex=1}}
function aligned(a,b){let A=S.rows.filter(x=>x.series===a),B=new Map(S.rows.filter(x=>x.series===b).map(x=>[x.timestamp,x])),p=A.filter(x=>B.has(x.timestamp)).map(x=>({t:x.timestamp,a:x.value,b:B.get(x.timestamp).value}));let r=[];for(let i=1;i<p.length;i++)r.push({t:p[i].t,ar:pct(p[i-1].a,p[i].a),br:pct(p[i-1].b,p[i].b)});return r.filter(x=>Number.isFinite(x.ar)&&Number.isFinite(x.br))}
function scanLag(seg,max){let out=[];for(let l=0;l<=max;l++){let a=[],b=[];for(let i=0;i+l<seg.length;i++){a.push(seg[i].ar);b.push(seg[i+l].br)}out.push({lag:l,c:corr(a,b),n:a.length})}return out}
function evalLag(seg,lag,thr,fric,sign){let p=[],hit=0;for(let i=0;i+lag+1<seg.length;i++){let s=seg[i].ar;if(Math.abs(s)<thr)continue;let move=0;for(let j=i+1;j<=i+lag+1&&j<seg.length;j++)move+=seg[j].br;let x=(s>0?1:-1)*sign*move-fric/10000;p.push(x);if(x>0)hit++}return{n:p.length,hit:p.length?hit/p.length:NaN,mean:mean(p),median:median(p)}}
function runHistory(){
 let a=$('src').value,b=$('dst').value,rr=aligned(a,b),max=+$('lag').value,thr=+$('thr').value/100,fr=+$('hfric').value;if(!a||!b||a===b)return $('histOut').innerHTML=card('Hold','<span class="bad">Choose different series.</span>');if(rr.length<30)return $('histOut').innerHTML=card('Hold','<span class="bad">Need ≥30 aligned returns; found '+rr.length+'.</span>');
 let n=rr.length,n1=Math.floor(n*.6),n2=Math.floor(n*.8),tr=rr.slice(0,n1),va=rr.slice(n1,n2),te=rr.slice(n2),best=scanLag(tr,max).filter(x=>Number.isFinite(x.c)&&x.n>=10).sort((x,y)=>Math.abs(y.c)-Math.abs(x.c))[0],sign=best.c>=0?1:-1,A=evalLag(tr,best.lag,thr,fr,sign),B=evalLag(va,best.lag,thr,fr,sign),C=evalLag(te,best.lag,thr,fr,sign),r={kind:'HISTORICAL_LAG_TEST',at:new Date().toISOString(),source:a,target:b,aligned:n,lag:best.lag,corr:best.c,direction:sign>0?'same':'inverse',thresholdPct:thr*100,frictionBps:fr,train:A,validation:B,test:C};S.histRuns.unshift(r);S.traces.unshift(r);save();$('histOut').innerHTML='<div class="grid">'+card('Training discovery','<div class="kpi">'+best.lag+' bars</div><div class="muted">|corr| '+fmt(Math.abs(best.c),3)+' · '+r.direction+'</div>')+card('Validation','<div class="kpi '+(B.mean>0?'good':'bad')+'">'+fmt(B.mean*100,3)+'%</div><div class="muted">hit '+fmt(B.hit*100,1)+'% · n='+B.n+'</div>')+card('Untouched test','<div class="kpi '+(C.mean>0?'good':'bad')+'">'+fmt(C.mean*100,3)+'%</div><div class="muted">hit '+fmt(C.hit*100,1)+'% · n='+C.n+'</div>')+'</div>'+card('Promotion gate',(B.mean>0&&C.mean>0&&B.n>=10&&C.n>=10?'<span class="warn"><b>HISTORICAL SURVIVAL CANDIDATE</b> — advance to live paper replication only.</span>':'<span class="good"><b>NO PROMOTION.</b> Training pattern did not robustly survive later partitions.</span>'));trace()
}

function summary(x){if(x.kind==='LIVE_PAPER_SCAN')return x.pair+' · '+(x.edge?x.edge.route+' · net '+fmt(x.edge.net,2)+' bps':'partial quote');if(x.kind==='HISTORICAL_LAG_TEST')return x.source+' → '+x.target+' · lag '+x.lag+' · test '+fmt(x.test.mean*100,3)+'%';if(x.kind==='MISMATCHED_CLOCK_TEST')return x.source?.series+' → '+x.target?.series+' · '+x.sourceTransform+'→'+x.targetTransform+' · '+x.lagBars+' bars / '+fmt(x.observedLagHours,1)+'h · '+x.clockBand+' · test association '+clockValue(x.test?.associationMean,x.targetUnit);if(x.kind==='CLOCK_STRESS_TEST')return x.source?.series+' → '+x.target?.series+' · forward mismatch '+(x.grid?.forwardMismatchSurvivals||0)+'/'+(x.grid?.forwardCompleted||0)+' · rolling '+(x.rolling?.mismatchSurvivals||0)+'/'+(x.rolling?.completed||0)+' · placebo '+(x.placebo?.mismatchSurvivals||0)+'/'+(x.placebo?.completed||0);if(x.kind==='CLOCK_NULL_FIELD')return 'screen '+x.observedMismatchCount+'/'+x.screenedPairs+' non-zero · null >= observed '+(x.familyNull?.roundsAtLeastObserved||0)+'/'+(x.familyNull?.completedRounds||0)+' · pair placebo '+(x.pairPlacebos?.[0]?.null?.mismatchedSurvivals??'—')+'/'+(x.pairPlacebos?.[0]?.null?.completed??'—');if(x.kind==='CLOCK_LAG_RARITY')return x.source?.series+' → '+x.target?.series+' · baseline '+x.baseline?.lagBars+'b · exact-null '+(x.placebo?.exactBaselineLagMismatchSurvivals??'—')+'/'+(x.placebo?.completed??'—')+' · any-null '+(x.placebo?.mismatchedSurvivals??'—')+'/'+(x.placebo?.completed??'—');if(x.kind==='CLOCK_FROZEN_CONFIRM')return x.source?.series+' → '+x.target?.series+' · frozen '+x.predeclared?.lagBars+'b '+x.predeclared?.direction+' · windows '+x.splitSurvivalWindows+'/'+x.completedWindows+' split-survive';if(x.kind==='CLOCK_PROSPECTIVE')return 'prospective '+x.lagBars+'b · '+x.status+' · resolved '+x.resolvedCount+' / signals '+x.signalCount+' · post-anchor bars '+x.postAnchorBars;if(x.kind==='MANUAL_PAPER_EDGE')return x.route+' · net '+fmt(x.net,2)+' bps';if(x.kind==='FULL_DEPTH_SWEEP
